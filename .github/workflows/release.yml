name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: npm swaps this job's GitHub OIDC token for a
  # short-lived publish token (no NPM_TOKEN secret, no 2FA prompt) and adds
  # provenance automatically
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # pnpm install sets up husky's hooks; the pre-commit hook would then run
      # on the "Version Packages" commit changesets makes here
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # no registry-url: its .npmrc would send a NODE_AUTH_TOKEN placeholder
          # instead of letting npm use OIDC
          node-version: 24
          cache: pnpm

      # trusted publishing needs npm 11.5.1+ (pnpm publish hands the upload to npm)
      - name: Check npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)" \
            || npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm release
          publish: pnpm release:publish
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no NPM_TOKEN: changesets/action then publishes through OIDC (trusted
          # publishing, configured on npmjs.com for linkvite/js + release.yml)
