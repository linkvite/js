name: CI

# Branch protection should require only the "CI" job at the bottom: the
# matrix job names change whenever the Node versions do.
#
# No schedule: GitHub disables scheduled workflows after 60 days without
# activity, which took this whole workflow (and every PR check) down with it.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # generated code matches spec/openapi.json, Biome lint + format,
      # typecheck, unit + type tests
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

  # the build on macOS and Windows too, after merging to main
  smoke-os:
    name: Build on ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  ci:
    name: CI
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: All Node versions passed
        run: '[ "${{ needs.quality.result }}" = success ]'
